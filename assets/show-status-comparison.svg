<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of visible and hidden output style indicators</title>
  <desc id="desc">Two terminal panels show the same explanatory output style. The default panel includes style: explanatory in the footer, while the hidden panel omits it.</desc>
  <rect width="1200" height="500" rx="24" fill="#111318"/>
  <text x="48" y="56" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">Status indicator</text>
  <text x="48" y="88" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">The output style remains active in both cases.</text>

  <g transform="translate(48 120)">
    <rect width="528" height="328" rx="14" fill="#08090c" stroke="#343741" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#ff6b6b"/>
    <circle cx="44" cy="24" r="6" fill="#ffd166"/>
    <circle cx="64" cy="24" r="6" fill="#6edb8f"/>
    <text x="24" y="72" fill="#d4a6c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Output style → "explanatory"</text>
    <text x="24" y="112" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Implementation complete.</text>
    <text x="24" y="148" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Insight: The style still shapes replies.</text>
    <line x1="24" y1="244" x2="504" y2="244" stroke="#343741"/>
    <text x="24" y="276" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">── tok/s ─────────────────────────</text>
    <text x="24" y="308" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">style: explanatory</text>
    <rect x="318" y="18" width="186" height="30" rx="15" fill="#2b2130"/>
    <text x="411" y="39" text-anchor="middle" fill="#e7b9db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">showStatus: true</text>
  </g>

  <g transform="translate(624 120)">
    <rect width="528" height="328" rx="14" fill="#08090c" stroke="#343741" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#ff6b6b"/>
    <circle cx="44" cy="24" r="6" fill="#ffd166"/>
    <circle cx="64" cy="24" r="6" fill="#6edb8f"/>
    <text x="24" y="72" fill="#d4a6c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Output style → "explanatory"</text>
    <text x="24" y="112" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Implementation complete.</text>
    <text x="24" y="148" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Insight: The style still shapes replies.</text>
    <line x1="24" y1="244" x2="504" y2="244" stroke="#343741"/>
    <text x="24" y="276" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">── tok/s ─────────────────────────</text>
    <rect x="310" y="18" width="194" height="30" rx="15" fill="#20252b"/>
    <text x="407" y="39" text-anchor="middle" fill="#b8c4ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">showStatus: false</text>
  </g>
</svg>
